[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inis-openai-agents"
version = "0.1.0"
description = "inis.run sandbox provider for the OpenAI Agents SDK (beta)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "inis.run" }]
dependencies = [
  "inis>=0.1.0,<1",
  # The `agents.sandbox` SandboxAgent surface is upstream BETA — see
  # https://openai.github.io/openai-agents-python/sandbox/clients/
  # ("Sandbox agents are in beta. Expect details of the API, defaults, and
  # supported capabilities to change before general availability."). This
  # adapter was written and tested against 0.19.x; the internal
  # `BaseSandboxSession`/`BaseSandboxClient` contract it implements is not a
  # documented third-party extension point (only OpenAI's own in-tree
  # backends implement it today), so pin tight and re-verify before widening.
  "openai-agents>=0.19.0,<0.20",
]
keywords = ["inis", "sandbox", "agents", "llm", "openai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://inis.run"
Repository = "https://github.com/inis-run/sdk/tree/main/openai-agents-python"
Issues = "https://github.com/inis-run/sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["inis_openai_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
