[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inis-strands-agents"
version = "0.1.1"
description = "inis.run sandbox provider for Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "inis.run" }]
dependencies = [
  "inis>=0.1.0,<1",
  # strands.sandbox (Sandbox / PosixShellSandbox) is a public, documented
  # extension point shipped in the core strands-agents package itself (see
  # sandbox.py's module docstring for how that was verified against
  # installed source). Verified against strands-agents==1.50.2.
  #
  # Pinned to the 1.50.x line, NOT the major. 1.51.0 moved
  # strands.vended_tools.bash.types, which sandbox.py imports
  # SANDBOX_BASH_DESCRIPTION from, so a <2 range floats straight into an
  # ImportError at `import inis_strands_agents`. Widen only after the
  # imports in sandbox.py are re-verified against the newer layout.
  "strands-agents>=1.50.0,<1.51",
]
keywords = ["inis", "sandbox", "strands", "strands-agents", "llm", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://inis.run"
Repository = "https://github.com/inis-run/sdk/tree/main/strands-agents-python"
Issues = "https://github.com/inis-run/sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["inis_strands_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
